services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://cs2user:cs2password@db:5432/cs2market
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cs2user
      POSTGRES_PASSWORD: cs2password
      POSTGRES_DB: cs2market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2user -d cs2market"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: